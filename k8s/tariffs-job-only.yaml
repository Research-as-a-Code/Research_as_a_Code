apiVersion: batch/v1
kind: Job
metadata:
  name: tariffs-docling-ingestion
  namespace: rag-blueprint
spec:
  ttlSecondsAfterFinished: 86400  # Clean up after 24 hours
  template:
    metadata:
      labels:
        job: tariffs-docling-ingestion
      annotations:
        karpenter.sh/do-not-disrupt: "true"  # Prevent Karpenter from evicting
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"  # Prevent autoscaler eviction
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        workload-type: ingestion  # Target ingestion nodepool
      containers:
      - name: ingest
        image: 962716963657.dkr.ecr.us-west-2.amazonaws.com/docling-ingestion:v2
        command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "✅ Using pre-built Docling image (no installation needed!)"
          echo "🚀 Starting Docling-powered ingestion..."
          
          python /scripts/ingest_with_docling.py
        env:
        - name: COLLECTION_NAME
          value: "us_tariffs"
        - name: DATA_DIR
          value: "/data/tariffs"
        - name: FILE_PATTERN
          value: "*.pdf"
        - name: DROP_EXISTING
          value: "false"  # Incremental mode: keep existing data
        - name: MILVUS_HOST
          value: "milvus-standalone"
        - name: MILVUS_PORT
          value: "19530"
        - name: EMBEDDING_NIM_URL
          value: "http://embedding-service.nim.svc.cluster.local:8000"
        volumeMounts:
        - name: script
          mountPath: /scripts
        - name: data
          mountPath: /data
          readOnly: true
        resources:
          requests:
            memory: "8Gi"
            cpu: "1"
          limits:
            memory: "16Gi"
            cpu: "4"
      volumes:
      - name: script
        configMap:
          name: tariffs-docling-ingest-script
          defaultMode: 0755
      - name: data
        persistentVolumeClaim:
          claimName: ingestion-data

