apiVersion: v1
kind: Pod
metadata:
  name: data-uploader
  namespace: rag-blueprint
spec:
  restartPolicy: Never
  containers:
  - name: uploader
    image: busybox
    command: ['sh', '-c', 'sleep 3600']  # Keep alive for 1 hour
    volumeMounts:
    - name: data
      mountPath: /data
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: ingestion-data

